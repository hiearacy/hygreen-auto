name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Package EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HygreenAuto app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HygreenAuto-Windows
          path: dist/HygreenAuto.exe
          if-no-files-found: error
          retention-days: 14
